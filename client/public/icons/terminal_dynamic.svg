<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c1e"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
  </defs>
  <!-- Squircle background -->
  <rect x="20" y="20" width="472" height="472" rx="102" ry="102" fill="url(#bg)"/>
  <!-- Terminal frame -->
  <rect x="40" y="40" width="432" height="390" rx="16" ry="16" fill="#000000" stroke="#383838" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="40" y="40" width="432" height="50" rx="16" ry="16" fill="#1c1c1e"/>
  <rect x="40" y="70" width="432" height="20" fill="#1c1c1e"/>
  <!-- Traffic lights -->
  <circle cx="72" cy="65" r="8" fill="#ff5f57"/>
  <circle cx="96" cy="65" r="8" fill="#febc2e"/>
  <circle cx="120" cy="65" r="8" fill="#28c840"/>
  <!-- Prompt text -->
  <text x="60" y="120" fill="#28c840" font-size="28" font-family="Menlo, Monaco, Courier New, monospace" font-weight="400">
    <tspan fill="#ffffff">$ </tspan>
    <tspan fill="#0a84ff">vibeos</tspan>
    <tspan fill="#ffffff"> ~ </tspan>
    <tspan fill="#ffffff">~</tspan>
  </text>
  <!-- Cursor blinking line -->
  <rect x="195" y="96" width="14" height="28" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Command output lines -->
  <text x="60" y="165" fill="#8e8e93" font-size="24" font-family="Menlo, Monaco, Courier New, monospace">
    <tspan fill="#5ac8fa">VibeOS</tspan>
    <tspan fill="#ffffff"> Simulator v1.0</tspan>
  </text>
  <text x="60" y="205" fill="#8e8e93" font-size="24" font-family="Menlo, Monaco, Courier New, monospace">
    <tspan fill="#ffffff">Running on WebContainer</tspan>
  </text>
  <text x="60" y="245" fill="#8e8e93" font-size="24" font-family="Menlo, Monaco, Courier New, monospace">
    <tspan fill="#30d158">✓</tspan>
    <tspan fill="#ffffff"> System ready</tspan>
  </text>
  <!-- Second prompt -->
  <text x="60" y="310" fill="#28c840" font-size="28" font-family="Menlo, Monaco, Courier New, monospace" font-weight="400">
    <tspan fill="#ffffff">$ </tspan>
    <tspan fill="#ffffff" opacity="0.5">_</tspan>
  </text>
  <!-- Glow effect at bottom -->
  <rect x="40" y="410" width="432" height="20" fill="#28c840" opacity="0.05" rx="0"/>
</svg>
